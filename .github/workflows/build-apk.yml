name: Build Luma Player APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -n "$SDK_MANAGER" ] && [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
          unzip -q /tmp/gradle-9.3.1.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Luma Player APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk LumaPlayer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaPlayer-APK
          path: LumaPlayer.apk

      - name: Publish clickable Latest Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest LumaPlayer.apk --clobber
          else
            gh release create latest LumaPlayer.apk \
              --title "Luma Player (Latest APK)" \
              --notes "Automatically built installable APK for Luma Player (Android 13+ optimized)." \
              --latest
          fi
