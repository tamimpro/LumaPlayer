name: Build Luma Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Luma Player APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk LumaPlayer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaPlayer-APK
          path: LumaPlayer.apk

      - name: Publish clickable Latest Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Luma Player (Latest APK)
          body: Automatically built installable APK for Luma Player (Android 13+ optimized).
          files: LumaPlayer.apk
          make_latest: true
